<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Something went wrong</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #f8f9fa; }
        .error-card { max-width: 460px; text-align: center; }
    </style>
</head>
<body>
    <div class="error-card">
        <h1 class="display-1 text-danger">500</h1>
        <h4 class="mb-3">Something went wrong on our end</h4>
        <p class="text-muted">
            {{ business_name }}'s system hit a temporary problem. This is usually
            over in a few seconds &mdash; please wait a moment and try again.
        </p>
        <a href="javascript:location.reload()" class="btn btn-primary mt-2">Try again</a>
    </div>
</body>
</html>
