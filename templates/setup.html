<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setup - {{ business_name }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body { background: #f8f9fa; }
        .setup-card { max-width: 420px; margin: 60px auto; }
    </style>
</head>
<body>
<div class="setup-card px-3">
    <div class="text-center mb-4">
        <i class="bi bi-shield-lock fs-1 text-dark"></i>
        <h4 class="mt-2">First-time Setup</h4>
        <p class="text-muted">Create your admin account to get started.</p>
    </div>
    <div class="card shadow-sm">
        <div class="card-body p-4">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }} py-2">{{ message }}</div>
                {% endfor %}
            {% endwith %}
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Admin Username</label>
                    <input type="text" name="username" class="form-control" autofocus required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Password <small class="text-muted">(min 6 characters)</small></label>
                    <input type="password" name="password" class="form-control" required>
                </div>
                <div class="mb-4">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" name="confirm" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-dark w-100">
                    <i class="bi bi-check-circle"></i> Create Admin Account
                </button>
            </form>
        </div>
    </div>
    <p class="text-center text-muted mt-3" style="font-size:0.85rem">
        This page is only shown once. After creating the admin account, it will be disabled.
    </p>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
