{% extends "base.html" %}
{% block title %}{{ 'Edit' if supplier else 'Add' }} Supplier{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-truck"></i> {{ 'Edit' if supplier else 'Add' }} Supplier</h2>
    <a href="{{ url_for('suppliers_list') }}" class="btn btn-secondary">
        <i class="bi bi-arrow-left"></i> Back
    </a>
</div>

<div class="card" style="max-width:560px">
    <div class="card-body">
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Name <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" required
                       value="{{ supplier.name if supplier else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Phone</label>
                <input type="text" name="phone" class="form-control"
                       value="{{ supplier.phone if supplier else '' }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Address</label>
                <textarea name="address" class="form-control" rows="2">{{ supplier.address if supplier else '' }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="text" name="email" class="form-control"
                       value="{{ supplier.email if supplier else '' }}">
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-dark">
                    <i class="bi bi-check-circle"></i> {{ 'Update' if supplier else 'Add Supplier' }}
                </button>
                <a href="{{ url_for('suppliers_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
